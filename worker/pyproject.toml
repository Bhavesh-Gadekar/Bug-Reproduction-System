[project]
name = "bug-reproduction-worker"
version = "0.1.0"
description = "LangGraph Worker Service for Bug Reproduction Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "redis>=5.0.0",
    "arq>=0.26.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "boto3>=1.34.0",
    "python-dotenv>=1.0.1",
    "google-genai>=0.1.0",
    "langchain-core>=0.2.0",
    "langgraph>=0.2.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
    "integration: marks test as integration test requiring external services",
]
asyncio_mode = "auto"

